services:
  web:
    image: nginx:1.27-alpine
    container_name: web_server
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./secure_web:/usr/share/nginx/html:ro
    networks: [frontend]

  database:
    image: mysql:8.4
    container_name: database_server
    environment:
      MYSQL_ROOT_PASSWORD: ${SECURE_DB_ROOT_PASSWORD:?Run implement_governance_controls.py --apply first}
      MYSQL_DATABASE: customer_data
      MYSQL_USER: app_user
      MYSQL_PASSWORD: ${SECURE_DB_PASSWORD:?Run implement_governance_controls.py --apply first}
    volumes:
      - ./database_init:/docker-entrypoint-initdb.d:ro
      - secure_db:/var/lib/mysql
    networks: [data]

  monitoring:
    image: alpine:3.20
    container_name: monitoring_server
    command: tail -f /dev/null
    networks: [frontend, data]

networks:
  frontend: {}
  data:
    internal: true

volumes:
  secure_db:

